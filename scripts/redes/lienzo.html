<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Motor de las piezas de redes: dibuja en canvas con la marca de Tankily y devuelve un MP4 (WebCodecs + mp4-muxer)
     o las láminas PNG de un carrusel. Lo abre scripts/redes/generar.mjs en Chrome sin ventana. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Geist:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="krill.js"></script>
</head><body style="margin:0;background:#071425">
<script>
const C = { abismo: '#050b14', fondo: '#071425', luz: '#15406a', texto: '#e6f1f7', texto2: '#a9bfce', agua: '#9fe7f5', ola: '#5aa8ff', aviso: '#ffd27a' };
const DISPLAY = '"Fredoka", system-ui, sans-serif', TEXTO = '"Geist", system-ui, sans-serif';
const T_PATH = new Path2D('M29 10V40a12 12 0 0 0 12 12h3');
const OLA_PATH = new Path2D('M14 26c5-4.2 10-4.2 15 0s10 4.2 15 0');

const cargarImagen = (src) => new Promise((r, e) => { const i = new Image(); i.onload = () => r(i); i.onerror = e; i.src = src; });
const suave = (x) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const vaiven = (x) => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;

function fondo(g, W, H, t) {
  const gr = g.createRadialGradient(W * 0.3, 0, 0, W * 0.3, 0, H * 1.1);
  gr.addColorStop(0, C.luz); gr.addColorStop(0.45, '#0a2038'); gr.addColorStop(0.85, C.abismo);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // Olas suaves abajo que avanzan despacio
  g.save(); g.lineCap = 'round';
  for (const [y, a, col, w, vel] of [[H - 150, 26, C.ola, 10, 22], [H - 95, 20, C.agua, 8, -16]]) {
    g.strokeStyle = col; g.globalAlpha = 0.16; g.lineWidth = w; g.beginPath();
    for (let x = -40; x <= W + 40; x += 12) { const yy = y + Math.sin((x + t * vel * 10) / 180) * a; x === -40 ? g.moveTo(x, yy) : g.lineTo(x, yy); }
    g.stroke();
  }
  g.restore();
}

// Logotipo: la t de ola dibujada + "ankily" en Fredoka 500
function logotipo(g, x, y, alto, { centrado = false, alpha = 1 } = {}) {
  g.save(); g.globalAlpha *= alpha;
  const s = alto / 64;
  g.font = `500 ${alto}px ${DISPLAY}`;
  const anchoTexto = g.measureText('ankily').width;
  const anchoT = 46 * s * 0.98;
  const total = anchoT + anchoTexto;
  const x0 = centrado ? x - total / 2 : x;
  g.save(); g.translate(x0 - 9.5 * s, y - alto * 0.83); g.scale(s, s);
  g.lineCap = 'round'; g.lineWidth = 9; g.strokeStyle = C.texto; g.stroke(T_PATH);
  const og = g.createLinearGradient(14, 0, 44, 0); og.addColorStop(0, C.agua); og.addColorStop(1, C.ola);
  g.lineWidth = 8.5; g.strokeStyle = og; g.stroke(OLA_PATH);
  g.fillStyle = C.agua; g.beginPath(); g.arc(51, 13, 4, 0, Math.PI * 2); g.fill();
  g.restore();
  g.fillStyle = C.texto; g.textBaseline = 'alphabetic'; g.fillText('ankily', x0 + anchoT, y);
  g.restore();
  return total;
}

function lineas(g, texto, ancho) {
  const res = [];
  for (const parrafo of String(texto).split('\n')) {
    let actual = '';
    for (const p of parrafo.split(' ')) {
      const prueba = actual ? actual + ' ' + p : p;
      if (g.measureText(prueba).width > ancho && actual) { res.push(actual); actual = p; } else actual = prueba;
    }
    res.push(actual);
  }
  return res;
}
// Texto con ajuste de línea; devuelve la altura usada
function texto(g, str, x, y, { ancho, tam, fuente = TEXTO, peso = 500, color = C.texto, interlineado = 1.18, alinear = 'left', max = 99 } = {}) {
  g.save(); g.font = `${peso} ${tam}px ${fuente}`; g.fillStyle = color; g.textAlign = alinear; g.textBaseline = 'top';
  let ls = lineas(g, str, ancho);
  // Si no cabe en `max` líneas, reduce el tamaño
  let t = tam;
  while (ls.length > max && t > 24) { t -= 4; g.font = `${peso} ${t}px ${fuente}`; ls = lineas(g, str, ancho); }
  ls.forEach((l, i) => g.fillText(l, x, y + i * t * interlineado));
  g.restore();
  return ls.length * t * interlineado;
}
function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function imagenCubre(g, img, x, y, w, h, zoom = 1) {
  const s = Math.max(w / img.width, h / img.height) * zoom;
  const iw = img.width * s, ih = img.height * s;
  g.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
}
function etiqueta(g, str, x, y, { tam = 26, color = C.fondo, fondoC = C.aviso } = {}) {
  g.save(); g.font = `600 ${tam}px ${TEXTO}`; const w = g.measureText(str).width + tam * 1.1;
  g.fillStyle = fondoC; rrect(g, x, y, w, tam * 1.7, tam * 0.85); g.fill();
  g.fillStyle = color; g.textBaseline = 'middle'; g.fillText(str, x + tam * 0.55, y + tam * 0.86); g.restore();
}

// Visuales dentro de una caja (x, y, w, hMax); p = avance de la escena (0–1) para el movimiento lento
function visual(g, v, rec, caja, p) {
  if (!v) return;
  const { x, y, w, h } = caja;
  g.save();
  if (v.tipo === 'pagina') {
    const img = rec[v.clave];
    const escala = w / img.width;
    const alto = Math.min(h, img.height * escala);
    const xx = x, yy = y + (h - alto) / 2;
    g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 50; g.shadowOffsetY = 18;
    rrect(g, xx, yy, w, alto, 34); g.fillStyle = C.fondo; g.fill();
    g.shadowColor = 'transparent';
    g.save(); rrect(g, xx, yy, w, alto, 34); g.clip();
    const zoom = 1 + 0.035 * p;
    const iw = img.width * escala * zoom, ih = img.height * escala * zoom;
    g.drawImage(img, xx + (w - iw) / 2, yy - (ih - alto) * 0.5 * p, iw, ih);
    g.restore();
    g.lineWidth = 3; g.strokeStyle = 'rgba(159,231,245,0.35)'; rrect(g, xx, yy, w, alto, 34); g.stroke();
    if (v.ejemplo) etiqueta(g, 'Datos de ejemplo', xx + 22, yy + 22);
  } else if (v.tipo === 'foto') {
    const f = rec[v.clave];
    const alto = Math.min(h - 50, w * 0.68);
    g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 50; g.shadowOffsetY = 18;
    rrect(g, x, y, w, alto, 34); g.fillStyle = C.fondo; g.fill(); g.shadowColor = 'transparent';
    g.save(); rrect(g, x, y, w, alto, 34); g.clip(); imagenCubre(g, f.img, x, y, w, alto, 1.02 + 0.05 * p); g.restore();
    texto(g, 'Foto: ' + f.credito, x + 6, y + alto + 16, { ancho: w - 12, tam: 22, color: C.texto2, peso: 400, max: 2 });
  } else if (v.tipo === 'cifra') {
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    let t = 230; g.font = `600 ${t}px ${DISPLAY}`;
    while (g.measureText(v.valor).width > w && t > 80) { t -= 10; g.font = `600 ${t}px ${DISPLAY}`; }
    const og = g.createLinearGradient(x, 0, x + w, 0); og.addColorStop(0, C.agua); og.addColorStop(1, C.ola);
    g.fillStyle = og; g.fillText(v.valor, x + w / 2, y + h * 0.55);
    if (v.pie) { g.font = `500 52px ${TEXTO}`; g.fillStyle = C.texto2; g.fillText(v.pie, x + w / 2, y + h * 0.55 + 90); }
  }
  g.restore();
}

// ---------- Reel (1080×1920) ----------
const R = { W: 1080, H: 1920, FPS: 30, SR: 48000 };
// La voz de cada tramo empieza un poco después de que entre la escena
const RETRASO = 0.15;
function duracionEscena(e) { return Math.min(5.2, Math.max(2.8, 1.7 + e.t.length * 0.05)); }
// Con locución, cada tramo dura lo que su frase más un respiro; sin ella, según la longitud del texto
function linea(pieza, voz) {
  const dv = (i) => (voz ? voz.dur[i] + RETRASO : 0);
  const tramos = [{ tipo: 'gancho', d: Math.max(2.8, dv(0) + 0.45), iv: 0 }];
  pieza.escenas.forEach((e, i) => tramos.push({ tipo: 'escena', e, d: voz ? Math.max(2.2, dv(i + 1) + 0.45) : duracionEscena(e), iv: i + 1 }));
  const nf = pieza.escenas.length + 1;
  tramos.push({ tipo: 'final', d: Math.max(3.0, dv(nf) + 0.9), iv: nf });
  let t = 0; for (const s of tramos) { s.ini = t; t += s.d; }
  return { tramos, total: t };
}
// Apertura de la boca de Krill: envolvente de volumen de su frase en ese instante
function bocaEn(voz, s, local) {
  if (!voz) return 0;
  const env = voz.env[s.iv], i = Math.floor((local - RETRASO) * R.FPS);
  return i >= 0 && i < env.length ? env[i] : 0;
}
function krillEn(g, x, y, tam, o, espejo = false) {
  g.save(); g.translate(x, y); if (espejo) g.scale(-1, 1); window.krill(g, 0, 0, tam, o); g.restore();
}
function dibujarReel(g, pieza, rec, t, lin, voz) {
  const { W, H } = R;
  fondo(g, W, H, t);
  for (const s of lin.tramos) {
    if (t < s.ini - 0.001 || t > s.ini + s.d + 0.001) continue;
    const local = t - s.ini, p = local / s.d;
    const entra = suave(local / 0.45), sale = 1 - suave((local - (s.d - 0.35)) / 0.35);
    const a = Math.min(entra, sale);
    const boca = bocaEn(voz, s, local);
    g.save(); g.globalAlpha = a;
    if (s.tipo === 'gancho') {
      logotipo(g, W / 2, 230, 64, { centrado: true });
      const alto = texto(g, pieza.gancho, 90, 420 + (1 - entra) * 40, { ancho: 900, tam: 100, fuente: DISPLAY, peso: 600, interlineado: 1.1, max: 6 });
      // Ola bajo el gancho
      g.save(); g.translate(90, 420 + alto + 50); g.scale(5, 5); g.lineCap = 'round'; g.lineWidth = 6;
      const og = g.createLinearGradient(14, 0, 44, 0); og.addColorStop(0, C.agua); og.addColorStop(1, C.ola); g.strokeStyle = og;
      g.translate(-14, -26); g.globalAlpha *= suave((local - 0.3) / 0.6); g.stroke(OLA_PATH); g.restore();
      krillEn(g, W / 2 + 40, Math.max(1180, 420 + alto + 420), 600, { expresion: pieza.kGancho || 'normal', boca, t });
    } else if (s.tipo === 'escena') {
      logotipo(g, W / 2, 200, 44, { centrado: true, alpha: 0.75 });
      if (!s.e.v) {
        // Sin visual: Krill grande reaccionando bajo el texto (memes incluidos)
        const altoT = texto(g, s.e.t, 90, 320 + (1 - entra) * 30, { ancho: 900, tam: 88, fuente: DISPLAY, peso: 600, interlineado: 1.12, max: 6 });
        g.globalAlpha = a * suave((local - 0.1) / 0.4);
        krillEn(g, W / 2 + 40, Math.max(1080, 320 + altoT + 360), 720, { expresion: s.e.k || 'normal', boca, t });
        g.restore();
        continue;
      }
      const altoT = texto(g, s.e.t, 90, 300 + (1 - entra) * 30, { ancho: 900, tam: 74, fuente: DISPLAY, peso: 600, interlineado: 1.12, max: 4 });
      const yv = Math.max(680, 300 + altoT + 60);
      g.globalAlpha = a * suave((local - 0.12) / 0.45);
      const ancho = s.e.v.tipo === 'pagina' ? 600 : 840;
      visual(g, s.e.v, rec, { x: (W - ancho) / 2, y: yv, w: ancho, h: 1330 - yv }, vaiven(p));
      // Krill pequeño abajo a la izquierda, mirando al contenido y hablando
      if (voz) krillEn(g, 220, 1505, 320, { expresion: s.e.k || 'normal', boca, t }, true);
    } else {
      logotipo(g, W / 2, 640, 140, { centrado: true });
      texto(g, 'Gratis en tankily.com', W / 2, 770, { ancho: 900, tam: 58, alinear: 'center', peso: 600 });
      texto(g, 'Enlace en el perfil', W / 2, 856, { ancho: 900, tam: 42, alinear: 'center', color: C.agua, peso: 500 });
      krillEn(g, W / 2 + 40, 1230, 560, { expresion: 'feliz', boca, t });
    }
    g.restore();
  }
}

// Voz: WAV en base64 → PCM a 48 kHz, duración y envolvente (para la boca) de cada frase
async function prepararVoz(wavs) {
  const ctx = new OfflineAudioContext(1, R.SR, R.SR);
  const res = { pcm: [], dur: [], env: [] };
  for (const b64 of wavs) {
    const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const buf = await ctx.decodeAudioData(bytes.buffer);
    const d = buf.getChannelData(0);
    const paso = Math.round(R.SR / R.FPS);
    const rms = [];
    for (let i = 0; i < d.length; i += paso) { let s = 0; const f = Math.min(d.length, i + paso); for (let j = i; j < f; j++) s += d[j] * d[j]; rms.push(Math.sqrt(s / (f - i))); }
    const max = Math.max(...rms) || 1;
    // Normalizada y suavizada: abre la boca con la voz y la cierra en los silencios
    const env = []; let prev = 0;
    for (const r of rms) { const v = Math.min(1, Math.max(0, (r / max - 0.12) * 1.6)); prev = prev * 0.35 + v * 0.65; env.push(prev); }
    res.pcm.push(d); res.dur.push(d.length / R.SR); res.env.push(env);
  }
  return res;
}

// ---------- Carrusel (1080×1350) ----------
const K = { W: 1080, H: 1350 };
function dibujarLamina(g, pieza, rec, i) {
  const { W, H } = K;
  const total = pieza.laminas.length + 2;
  fondo(g, W, H, i * 0.7);
  if (i === 0) {
    texto(g, pieza.serie || '', 90, 150, { ancho: 900, tam: 36, color: C.agua, peso: 600 });
    const alto = texto(g, pieza.gancho, 90, 260, { ancho: 900, tam: 100, fuente: DISPLAY, peso: 600, interlineado: 1.1, max: 6 });
    g.save(); g.translate(90 - 42, 260 + alto + 20); g.scale(3, 3); g.lineCap = 'round'; g.lineWidth = 6;
    const og = g.createLinearGradient(14, 0, 44, 0); og.addColorStop(0, C.agua); og.addColorStop(1, C.ola); g.strokeStyle = og; g.stroke(OLA_PATH); g.restore();
    krillEn(g, W - 300, 1000, 440, { expresion: pieza.kPortada || 'pensando', t: 0.4, parpadeo: 0 });
    logotipo(g, 90, H - 110, 56);
    texto(g, 'Desliza →', W - 90, H - 150, { ancho: 400, tam: 38, alinear: 'right', color: C.texto2 });
    return;
  }
  texto(g, `${i + 1}/${total}`, W - 80, 70, { ancho: 200, tam: 30, alinear: 'right', color: C.texto2, peso: 500 });
  if (i === total - 1) {
    logotipo(g, W / 2, 560, 130, { centrado: true });
    texto(g, 'Guárdalo para cuando lo necesites', W / 2, 680, { ancho: 900, tam: 50, alinear: 'center', peso: 600 });
    texto(g, 'Gratis en tankily.com · Enlace en el perfil', W / 2, 760, { ancho: 900, tam: 38, alinear: 'center', color: C.agua });
    krillEn(g, W / 2 + 30, 1060, 460, { expresion: 'feliz', t: 0.4, parpadeo: 0 });
    return;
  }
  const l = pieza.laminas[i - 1];
  if (!l.v) {
    // Lámina solo de texto: bloque más grande y centrado
    g.save(); g.font = `600 92px ${DISPLAY}`; const nt = l.titulo ? lineas(g, l.titulo, 860).length : 0;
    g.font = `400 58px ${TEXTO}`; const nc = lineas(g, l.t, 900).length; g.restore();
    const altoBloque = nt * 92 * 1.1 + (nt ? 36 : 0) + nc * 58 * 1.3;
    let yb = Math.max(150, (H - altoBloque) / 2 - 30);
    if (l.titulo) yb += texto(g, l.titulo, 90, yb, { ancho: 860, tam: 92, fuente: DISPLAY, peso: 600, interlineado: 1.1, max: 3 }) + 36;
    texto(g, l.t, 90, yb, { ancho: 900, tam: 58, color: C.texto, peso: 400, interlineado: 1.3, max: 7 });
    logotipo(g, 90, H - 70, 38, { alpha: 0.7 });
    return;
  }
  let y = 130;
  if (l.titulo) y += texto(g, l.titulo, 90, y, { ancho: 860, tam: 76, fuente: DISPLAY, peso: 600, interlineado: 1.1, max: 3 }) + 26;
  y += texto(g, l.t, 90, y, { ancho: 900, tam: 46, color: C.texto, peso: 400, interlineado: 1.3, max: 5 }) + 50;
  if (l.v) {
    const ancho = l.v.tipo === 'pagina' ? 560 : 900;
    visual(g, l.v, rec, { x: (W - ancho) / 2, y, w: ancho, h: H - 90 - y }, 0.3);
  }
  logotipo(g, 90, H - 70, 38, { alpha: 0.7 });
}

async function base64(blob) {
  const buf = new Uint8Array(await blob.arrayBuffer());
  let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode(...buf.subarray(i, i + 0x8000));
  return btoa(s);
}

// Punto de entrada: pieza + recursos { clave: dataURL | { src, credito } }
window.generar = async (pieza, recursosEntrada) => {
  await document.fonts.load(`600 80px ${DISPLAY}`); await document.fonts.load(`500 80px ${DISPLAY}`);
  await document.fonts.load(`500 40px ${TEXTO}`); await document.fonts.load(`400 40px ${TEXTO}`); await document.fonts.load(`600 40px ${TEXTO}`);
  const rec = {};
  for (const [k, v] of Object.entries(recursosEntrada)) if (k !== '__voz') rec[k] = typeof v === 'string' ? await cargarImagen(v) : { img: await cargarImagen(v.src), credito: v.credito };

  if (pieza.formato === 'carrusel') {
    const laminas = [];
    const total = pieza.laminas.length + 2;
    for (let i = 0; i < total; i++) {
      const c = new OffscreenCanvas(K.W, K.H); const g = c.getContext('2d');
      dibujarLamina(g, pieza, rec, i);
      laminas.push(await base64(await c.convertToBlob({ type: 'image/png' })));
    }
    return { laminas };
  }

  const voz = recursosEntrada.__voz ? await prepararVoz(recursosEntrada.__voz) : null;
  const lin = linea(pieza, voz);
  const { W, H, FPS, SR } = R;
  const c = new OffscreenCanvas(W, H); const g = c.getContext('2d');
  // Fotogramas sueltos para revisar (mitad de cada tramo) y portada (gancho ya visible)
  const revision = [];
  for (const s of lin.tramos) { dibujarReel(g, pieza, rec, s.ini + s.d * 0.6, lin, voz); revision.push(await base64(await c.convertToBlob({ type: 'image/jpeg', quality: 0.8 }))); }
  dibujarReel(g, pieza, rec, 1.6, lin, voz);
  const portada = await base64(await c.convertToBlob({ type: 'image/jpeg', quality: 0.9 }));

  const cfg = { codec: 'avc1.640028', width: W, height: H, bitrate: 8e6, framerate: FPS };
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H, frameRate: FPS },
    ...(voz ? { audio: { codec: 'aac', numberOfChannels: 1, sampleRate: SR } } : {}), fastStart: 'in-memory' });
  let fallo = null;

  // Pista de audio: cada frase en el arranque de su tramo, codificada en AAC
  if (voz) {
    const pista = new Float32Array(Math.ceil(lin.total * SR));
    lin.tramos.forEach((s) => { const d = voz.pcm[s.iv]; if (d) pista.set(d.subarray(0, Math.max(0, pista.length - Math.round((s.ini + RETRASO) * SR))), Math.round((s.ini + RETRASO) * SR)); });
    const aenc = new AudioEncoder({ output: (ch, meta) => muxer.addAudioChunk(ch, meta), error: (e) => { fallo = e; } });
    aenc.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 1, bitrate: 128000 });
    for (let i = 0; i < pista.length; i += 1024) {
      const n = Math.min(1024, pista.length - i);
      const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 1, timestamp: Math.round(i * 1e6 / SR), data: pista.slice(i, i + n) });
      aenc.encode(ad); ad.close();
    }
    await aenc.flush();
    if (fallo) throw fallo;
  }

  const enc = new VideoEncoder({ output: (ch, meta) => muxer.addVideoChunk(ch, meta), error: (e) => { fallo = e; } });
  enc.configure(cfg);
  const n = Math.ceil(lin.total * FPS);
  for (let i = 0; i < n; i++) {
    dibujarReel(g, pieza, rec, i / FPS, lin, voz);
    const f = new VideoFrame(c, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(f, { keyFrame: i % (FPS * 2) === 0 }); f.close();
    if (enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 4));
    if (fallo) throw fallo;
  }
  await enc.flush(); muxer.finalize();
  return { video: await base64(new Blob([muxer.target.buffer])), portada, revision, duracion: lin.total };
};
window.listo = true;
</script>
</body></html>
