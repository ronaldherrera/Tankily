<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Motor v2 de las piezas de redes (skill director-arte-redes): fotos a sangre, pantallas dentro de un móvil real,
     subtítulos palabra a palabra, cortes por acercamiento y portadas de varias familias. Lo abre generar.mjs --v2. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Geist:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="krill.js"></script>
</head><body style="margin:0;background:#071425">
<script>
const DISPLAY = '"Fredoka", system-ui, sans-serif', TEXTO = '"Geist", system-ui, sans-serif';
const T_PATH = new Path2D('M29 10V40a12 12 0 0 0 12 12h3');
const OLA_PATH = new Path2D('M14 26c5-4.2 10-4.2 15 0s10 4.2 15 0');
// Paletas por pieza: misma marca, distinto ambiente (la cuadrícula del perfil no puede parecer una sola publicación)
const PALETAS = {
  abismo: { fondo1: '#15406a', fondo2: '#050b14', tinta: '#ffffff', acento: '#9fe7f5', suave: '#a9bfce' },
  agua: { fondo1: '#c9f3fb', fondo2: '#7fd3ea', tinta: '#06243a', acento: '#0b5cab', suave: '#1d4a63' },
  coral: { fondo1: '#ffb3a4', fondo2: '#ff7a6b', tinta: '#2b0d12', acento: '#ffffff', suave: '#5a1f2c' },
  hondo: { fondo1: '#3d7dff', fondo2: '#1f3fbf', tinta: '#ffffff', acento: '#ffe08a', suave: '#d5e2ff' },
  arena: { fondo1: '#f6efe3', fondo2: '#e6d7bd', tinta: '#2a2216', acento: '#0b5cab', suave: '#6b5b43' },
  musgo: { fondo1: '#1f5c4a', fondo2: '#0c2a22', tinta: '#ffffff', acento: '#b8f5a0', suave: '#b9d9cc' },
};
const cargarImagen = (src) => new Promise((r, e) => { const i = new Image(); i.onload = () => r(i); i.onerror = e; i.src = src; });
const suave = (x) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const vaiven = (x) => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function lineas(g, texto, ancho) {
  const res = [];
  for (const parrafo of String(texto).split('\n')) {
    let actual = '';
    // Artículos y preposiciones (la, de, y…) no se quedan al final de línea: van con la siguiente
    for (const p of parrafo.replace(/(?<=^|\s)(a|al|de|del|el|en|la|las|lo|los|un|una|y|o|e|u|tu|su|mi|con|por|sin) (?=\S)/gi, '$1 ').split(' ')) { const prueba = actual ? actual + ' ' + p : p; if (g.measureText(prueba).width > ancho && actual) { res.push(actual); actual = p; } else actual = prueba; }
    res.push(actual);
  }
  return res;
}
function texto(g, str, x, y, { ancho, tam, fuente = TEXTO, peso = 600, color = '#fff', interlineado = 1.12, alinear = 'left', sombra = false, max = 9 } = {}) {
  g.save(); g.font = `${peso} ${tam}px ${fuente}`; g.fillStyle = color; g.textAlign = alinear; g.textBaseline = 'top';
  let t = tam, ls = lineas(g, str, ancho);
  while (ls.length > max && t > 28) { t -= 4; g.font = `${peso} ${t}px ${fuente}`; ls = lineas(g, str, ancho); }
  if (sombra) { g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 24; g.shadowOffsetY = 4; }
  // Chrome recorta por arriba los trazos altos (k, l, punto de la i) de Fredoka en negrita a tamaños medios:
  // se dibuja a 4x y se reduce, porque a ese tamaño los glifos se pintan como trazados y no se recortan
  const k = t < 240 ? 4 : 1;
  g.translate(x, y); g.scale(1 / k, 1 / k); g.font = `${peso} ${t * k}px ${fuente}`;  ls.forEach((l, i) => g.fillText(l, 0, i * t * interlineado * k));
  g.restore();
  return ls.length * t * interlineado;
}
function imagenCubre(g, img, x, y, w, h, zoom = 1, fx = 0.5, fy = 0.5) {
  // Los vídeos tienen sus dimensiones en videoWidth/videoHeight (width/height valen 0)
  const ancho = img.videoWidth || img.naturalWidth || img.width, alto = img.videoHeight || img.naturalHeight || img.height;
  const s = Math.max(w / ancho, h / alto) * zoom;
  const iw = ancho * s, ih = alto * s;
  g.drawImage(img, x + (w - iw) * fx, y + (h - ih) * fy, iw, ih);
}
// Foto de especie con el ejemplar siempre entero: `f.sujeto` es su recuadro en la foto (fracciones x0, y0, x1, y1,
// de fotos/creditos.json). Se amplía como mucho hasta que el recuadro llena el 92 % del hueco; si entonces la foto no
// cubre el hueco, lo que sobra se rellena con la misma foto desenfocada (nunca bandas vacías ni peces cortados)
function encuadre(g, f, x, y, w, h, zoom = 1) {
  const img = f.img || f, caja = f.sujeto;
  if (!caja) { g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); imagenCubre(g, img, x, y, w, h, zoom); g.restore(); return; }
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const bw = (caja[2] - caja[0]) * iw, bh = (caja[3] - caja[1]) * ih;
  const s = Math.min(Math.max(w / iw, h / ih) * zoom, Math.min(w * 0.92 / bw, h * 0.92 / bh));
  const dw = iw * s, dh = ih * s;
  // El ejemplar al centro; si la foto cubre el hueco, sin dejar huecos por los lados
  const centrar = (tam, d, c0, c1, o) => { let p = o + tam / 2 - ((c0 + c1) / 2) * d; if (d >= tam) p = Math.min(o, Math.max(o + tam - d, p)); return p; };
  const dx = centrar(w, dw, caja[0], caja[2], x), dy = centrar(h, dh, caja[1], caja[3], y);
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  if (dw < w - 1 || dh < h - 1 || dx > x + 1 || dy > y + 1) {

    const mini = new OffscreenCanvas(Math.max(16, Math.round(w / 8)), Math.max(16, Math.round(h / 8)));
    const mg = mini.getContext('2d'); mg.filter = 'blur(6px)'; imagenCubre(mg, img, -12, -12, mini.width + 24, mini.height + 24, 1.15);
    g.imageSmoothingQuality = 'high'; g.filter = 'blur(10px)'; g.drawImage(mini, x - 30, y - 30, w + 60, h + 60); g.filter = 'none';
    g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x, y, w, h);
    g.shadowColor = 'rgba(0,0,0,0.35)'; g.shadowBlur = 40;

}
function logotipo(g, x, y, alto, { centrado = false, color = '#e6f1f7', alpha = 1 } = {}) {
  g.save(); g.globalAlpha *= alpha;
  const s = alto / 64; g.font = `500 ${alto}px ${DISPLAY}`;
  const anchoT = 46 * s * 0.98, total = anchoT + g.measureText('ankily').width;
  const x0 = centrado ? x - total / 2 : x;
  g.save(); g.translate(x0 - 9.5 * s, y - alto * 0.83); g.scale(s, s); g.lineCap = 'round';
  g.lineWidth = 9; g.strokeStyle = color; g.stroke(T_PATH);
  // Sobre fondos claros (letras oscuras) la ola celeste se pierde: se usan los azules hondos de la marca
  const n = parseInt(color.slice(1), 16), claro = ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 128;
  const [o1, o2] = claro ? ['#9fe7f5', '#5aa8ff'] : ['#0e9cc4', '#0b5cab'];
  const og = g.createLinearGradient(14, 0, 44, 0); og.addColorStop(0, o1); og.addColorStop(1, o2);
  g.lineWidth = 8.5; g.strokeStyle = og; g.stroke(OLA_PATH);
  g.fillStyle = o1; g.beginPath(); g.arc(51, 13, 4, 0, Math.PI * 2); g.fill(); g.restore();
  g.fillStyle = color; g.textBaseline = 'alphabetic'; g.fillText('ankily', x0 + anchoT, y);
  g.restore();
}
function fondoPaleta(g, W, H, pal, t = 0) {
  const gr = g.createLinearGradient(0, 0, W * 0.4, H);
  gr.addColorStop(0, pal.fondo1); gr.addColorStop(1, pal.fondo2);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // Burbujas suaves que suben: algo de vida en los fondos lisos
  g.save(); g.globalAlpha = 0.12; g.fillStyle = '#ffffff';
  for (let i = 0; i < 14; i++) { const x = (i * 173) % W, y = H - ((t * 60 + i * 241) % (H + 200)) + 100, r = 6 + (i % 4) * 5; g.beginPath(); g.arc(x + Math.sin(t + i) * 12, y, r, 0, Math.PI * 2); g.fill(); }
  g.restore();
}
function grano(g, W, H, semilla) {
  // Grano fotográfico muy sutil: quita el aspecto «de ordenador» de los fondos lisos
  g.save(); g.globalAlpha = 0.05;
  let s = semilla * 9301 + 49297;
  for (let i = 0; i < 2600; i++) { s = (s * 9301 + 49297) % 233280; const x = (s / 233280) * W; s = (s * 9301 + 49297) % 233280; const y = (s / 233280) * H; g.fillStyle = i % 2 ? '#fff' : '#000'; g.fillRect(x, y, 2, 2); }
  g.restore();
}
function etiqueta(g, str, x, y, { tam = 26, color = '#071425', fondoC = '#ffd27a' } = {}) {
  g.save(); g.font = `600 ${tam}px ${TEXTO}`; const w = g.measureText(str).width + tam * 1.1;
  g.fillStyle = fondoC; rrect(g, x, y, w, tam * 1.7, tam * 0.85); g.fill();
  g.fillStyle = color; g.textBaseline = 'middle'; g.fillText(str, x + tam * 0.55, y + tam * 0.86); g.restore();
}

// Móvil realista: marco, isla, barra de estado e indicador de inicio; la captura se desplaza dentro (grabación de pantalla)
function movil(g, img, cx, cy, ancho, { avance = 0, rot = 0, ejemplo = false } = {}) {
  const alto = ancho * 2.06, r = ancho * 0.14, borde = ancho * 0.035;
  g.save(); g.translate(cx, cy); g.rotate(rot);
  g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 70; g.shadowOffsetY = 30;
  rrect(g, -ancho / 2, -alto / 2, ancho, alto, r); g.fillStyle = '#0b0d10'; g.fill();
  g.shadowColor = 'transparent';
  // Canto metálico
  const canto = g.createLinearGradient(-ancho / 2, 0, ancho / 2, 0); canto.addColorStop(0, '#5b626b'); canto.addColorStop(0.5, '#262a30'); canto.addColorStop(1, '#5b626b');
  g.lineWidth = 6; g.strokeStyle = canto; rrect(g, -ancho / 2, -alto / 2, ancho, alto, r); g.stroke();
  const sx = -ancho / 2 + borde, sy = -alto / 2 + borde, sw = ancho - borde * 2, sh = alto - borde * 2, sr = r - borde;
  g.save(); rrect(g, sx, sy, sw, sh, sr); g.clip();
  g.fillStyle = '#071425'; g.fillRect(sx, sy, sw, sh);
  // Barra de estado (zona de la isla) y debajo la captura, que se desplaza con el avance
  const barra = sh * 0.055;
  const escala = sw / img.width, ih = img.height * escala;
  const recorrido = Math.max(0, ih - (sh - barra));
  g.drawImage(img, sx, sy + barra - recorrido * avance, sw, ih);
  g.fillStyle = '#071425'; g.fillRect(sx, sy, sw, barra);
  g.fillStyle = '#ffffff'; g.font = `600 ${barra * 0.42}px ${TEXTO}`; g.textBaseline = 'middle'; g.fillText('9:41', sx + sw * 0.1, sy + barra * 0.55);
  // Batería y cobertura
  const bx = sx + sw * 0.8, by = sy + barra * 0.42;
  g.strokeStyle = '#ffffff'; g.lineWidth = 2.5; rrect(g, bx, by, sw * 0.075, barra * 0.28, 4); g.stroke(); g.fillRect(bx + 3, by + 3, sw * 0.05, barra * 0.28 - 6);
  for (let i = 0; i < 4; i++) g.fillRect(sx + sw * 0.68 + i * 9, by + barra * 0.22 - i * 4, 6, 8 + i * 4);
  // Indicador de inicio
  g.globalAlpha = 0.6; rrect(g, -sw * 0.18, sy + sh - barra * 0.35, sw * 0.36, 8, 4); g.fill(); g.globalAlpha = 1;
  g.restore();

  g.restore();
}

function krillEn(g, x, y, tam, o, espejo = false) { g.save(); g.translate(x, y); if (espejo) g.scale(-1, 1); window.krill(g, 0, 0, tam, o); g.restore(); }

// ---------- Reel v2 ----------
const R = { W: 1080, H: 1920, FPS: 30, SR: 48000 };
const RETRASO = 0.12;
function linea(pieza, voz) {
  const dv = (i) => (voz ? voz.dur[i] + RETRASO : 0);
  const tramos = [{ tipo: 'gancho', d: Math.max(2.4, dv(0) + 0.3), iv: 0 }];
  pieza.escenas.forEach((e, i) => tramos.push({ tipo: 'escena', e, d: Math.max(2.0, dv(i + 1) + 0.25), iv: i + 1 }));
  const nf = pieza.escenas.length + 1;
  tramos.push({ tipo: 'final', d: Math.max(2.4, dv(nf) + 0.5), iv: nf });
  let t = 0; for (const s of tramos) { s.ini = t; t += s.d; }
  return { tramos, total: t };
}
// Subtítulos: palabras repartidas por la duración de la frase (proporcional a su longitud), en grupos de 3–4
function subtitulo(g, frase, dur, local, y, pal, segs) {
  if (!frase || local < RETRASO) return;
  // Con segmentos de la voz (trozo, inicio, fin): se muestra el trozo que suena y la palabra se reparte dentro de él
  let palabras, tt;
  const tl = local - RETRASO;
  if (segs && segs.length) {
    let s = segs.findIndex((x, i) => tl < (segs[i + 1] ? segs[i + 1].ini : Infinity));
    if (s < 0) s = segs.length - 1;
    const seg = segs[s];
    if (tl < seg.ini - 0.05 && s === 0) return;
    palabras = seg.texto.replace(/\s+/g, ' ').trim().split(' ');
    tt = Math.min(0.999, Math.max(0, (tl - seg.ini) / Math.max(0.1, seg.fin - seg.ini)));
  } else {
    palabras = frase.replace(/\s+/g, ' ').trim().split(' ');
    tt = Math.min(0.999, tl / dur);
  }
  const pesos = palabras.map((p) => p.length + 2), total = pesos.reduce((a, b) => a + b, 0);
  let acum = 0, actual = 0;
  for (let i = 0; i < palabras.length; i++) { acum += pesos[i] / total; if (tt < acum) { actual = i; break; } actual = i; }
  const grupo = Math.floor(actual / 4) * 4, trozo = palabras.slice(grupo, grupo + 4);
  g.save(); g.font = `700 64px ${DISPLAY}`; g.textBaseline = 'middle';
  const anchos = trozo.map((p) => g.measureText(p + ' ').width), anchoTotal = anchos.reduce((a, b) => a + b, 0);
  let x = (R.W - anchoTotal) / 2;
  // Fondo de lectura
  g.fillStyle = 'rgba(5,11,20,0.55)'; rrect(g, x - 28, y - 52, anchoTotal + 40, 104, 26); g.fill();
  trozo.forEach((p, i) => {
    const activa = grupo + i === actual;
    g.fillStyle = activa ? '#9fe7f5' : '#ffffff';
    g.fillText(p, x, y + (activa ? -3 : 0)); x += anchos[i];
  });
  g.restore();
}
function bocaEn(voz, s, local) { if (!voz) return 0; const env = voz.env[s.iv], i = Math.floor((local - RETRASO) * R.FPS); return i >= 0 && i < env.length ? env[i] : 0; }

function dibujarReel(g, pieza, rec, t, lin, voz) {
  const { W, H } = R;
  const pal = PALETAS[pieza.paleta || 'abismo'];
  for (const s of lin.tramos) {
    if (t < s.ini - 0.001 || t > s.ini + s.d + 0.001) continue;
    const local = t - s.ini, p = local / s.d;
    // Corte por acercamiento a mitad de tramo (sensación de cambio de plano)
    const corte = p > 0.5 ? 1.08 : 1;
    const entra = suave(local / 0.25);
    const boca = bocaEn(voz, s, local);
    const frase = voz ? voz.texto[s.iv] : '';
    const dur = voz ? voz.dur[s.iv] : s.d;

    if (s.tipo === 'gancho') {
      // Gancho: imagen fuerte (mejor vídeo real) + texto corto. Sin logo de entrada
      const vid = pieza.ganchoVideo && rec.__videos[pieza.ganchoVideo.clave];
      let v = pieza.ganchoVisual && rec[pieza.ganchoVisual.clave];
      if (vid) {
        // Vídeo horizontal en reel vertical: a pantalla completa con un paneo lento de un lado a otro (sin bandas negras)
        imagenCubre(g, vid.el, 0, 0, W, H, 1.04, 0.15 + 0.7 * vaiven(Math.min(1, p)), 0.5);
        v = { credito: vid.credito, video: true };
      } else if (v) { encuadre(g, v, 0, 0, W, H, (1.05 + 0.08 * p) * corte); }
      else fondoPaleta(g, W, H, pal, t);
      const sombra = g.createLinearGradient(0, 0, 0, H); sombra.addColorStop(0, 'rgba(0,0,0,0.55)'); sombra.addColorStop(0.45, 'rgba(0,0,0,0.05)'); sombra.addColorStop(1, 'rgba(0,0,0,0.6)');
      if (v) { g.fillStyle = sombra; g.fillRect(0, 0, W, H); }
      g.save(); g.globalAlpha = entra; g.translate(0, (1 - entra) * 30);
      texto(g, pieza.gancho, 80, 300, { ancho: 920, tam: 112, fuente: DISPLAY, peso: 700, color: v ? '#ffffff' : pal.tinta, sombra: !!v, max: 5, interlineado: 1.05 });
      g.restore();
      subtitulo(g, frase, dur, local, 1380, pal, voz && voz.seg[s.iv]);
      if (v && v.credito) texto(g, (v.video ? 'Vídeo: ' : 'Foto: ') + v.credito, 40, H - 44, { ancho: 760, tam: 16, peso: 400, color: 'rgba(255,255,255,0.6)', max: 1 });
    } else if (s.tipo === 'escena') {
      const e = s.e, v = e.v;
      if (v && v.tipo === 'foto') {
        // Si la especie tiene vídeo, va el vídeo a pantalla completa con un paneo lento (nada de imágenes quietas)
        const vid = v.video && rec.__videos[v.video];
        const f = vid ? { img: vid.el, credito: vid.credito } : rec[v.clave];
        if (vid) imagenCubre(g, vid.el, 0, 0, W, H, 1.04 * corte, 0.15 + 0.7 * vaiven(Math.min(1, p)), 0.5);
        else encuadre(g, f, 0, 0, W, H, (1.04 + 0.06 * p) * corte);
        const sombra = g.createLinearGradient(0, 0, 0, H); sombra.addColorStop(0, 'rgba(0,0,0,0.6)'); sombra.addColorStop(0.35, 'rgba(0,0,0,0)'); sombra.addColorStop(0.7, 'rgba(0,0,0,0)'); sombra.addColorStop(1, 'rgba(0,0,0,0.65)');
        g.fillStyle = sombra; g.fillRect(0, 0, W, H);
        g.save(); g.globalAlpha = entra; texto(g, e.t, 80, 280, { ancho: 920, tam: 76, fuente: DISPLAY, peso: 700, sombra: true, max: 4 }); g.restore();
        texto(g, (vid ? 'Vídeo: ' : 'Foto: ') + f.credito, 40, H - 44, { ancho: 760, tam: 16, peso: 400, color: 'rgba(255,255,255,0.6)', max: 1 });
      } else if (v && v.tipo === 'pagina') {
        fondoPaleta(g, W, H, pal, t);
        g.save(); g.globalAlpha = entra; texto(g, e.t, 80, 250, { ancho: 920, tam: 64, fuente: DISPLAY, peso: 700, color: pal.tinta, max: 3 }); g.restore();
        const rot = ((pieza.n + s.iv) % 3 - 1) * 0.035;
        movil(g, rec[v.clave], W / 2, 1060 + (1 - entra) * 60, 560 * corte, { avance: vaiven(Math.min(1, p * 1.1)), rot, ejemplo: v.ejemplo });
      } else if (v && v.tipo === 'cifra') {
        fondoPaleta(g, W, H, PALETAS[pieza.paletaCifra || 'hondo'], t);
        const pc = PALETAS[pieza.paletaCifra || 'hondo'];
        g.save(); g.globalAlpha = entra; texto(g, e.t, 80, 280, { ancho: 920, tam: 64, fuente: DISPLAY, peso: 700, color: pc.tinta, max: 3 }); g.restore();
        g.save(); g.translate(W / 2, 900); const esc = 0.85 + 0.15 * suave(local / 0.35); g.scale(esc * corte, esc * corte);
        g.textAlign = 'center'; g.textBaseline = 'middle'; let tam = 300; g.font = `700 ${tam}px ${DISPLAY}`;
        while (g.measureText(v.valor).width > 940 && tam > 100) { tam -= 10; g.font = `700 ${tam}px ${DISPLAY}`; }
        g.fillStyle = pc.acento; g.fillText(v.valor, 0, 0);
        if (v.pie) { g.font = `600 60px ${TEXTO}`; g.fillStyle = pc.tinta; g.fillText(v.pie, 0, tam * 0.62); }
        g.restore();
      } else {
        // Escena sin visual: frase/meme grande a pantalla completa con Krill como sello
        fondoPaleta(g, W, H, PALETAS[pieza.paletaMeme || 'coral'], t);
        const pm = PALETAS[pieza.paletaMeme || 'coral'];
        g.save(); g.globalAlpha = entra; g.translate(0, (1 - entra) * 20);
        texto(g, e.t, 80, 360, { ancho: 920, tam: 96, fuente: DISPLAY, peso: 700, color: pm.tinta, max: 6, interlineado: 1.08 });
        g.restore();
        krillEn(g, W - 260, 1180, 380, { expresion: e.k || 'normal', boca, t });
      }
      subtitulo(g, frase, dur, local, 1440, pal, voz && voz.seg[s.iv]);
    } else {
      // Cierre corto: marca + llamada a la acción; Krill firma
      fondoPaleta(g, W, H, pal, t);
      logotipo(g, W / 2, 760, 130, { centrado: true, color: pal.tinta });
      texto(g, 'Gratis en tankily.com', W / 2, 880, { ancho: 900, tam: 54, alinear: 'center', color: pal.tinta });
      texto(g, 'Enlace en el perfil', W / 2, 960, { ancho: 900, tam: 40, alinear: 'center', color: pal.acento, peso: 500 });
      krillEn(g, W / 2 + 30, 1240, 380, { expresion: 'feliz', boca, t });
      subtitulo(g, frase, dur, local, 1440, pal, voz && voz.seg[s.iv]);
    }
    grano(g, W, H, Math.floor(t * R.FPS) % 7);
  }
}

// ---------- Portadas: familias distintas con el mismo sistema de marca ----------
function portada(g, pieza, rec, W, H) {
  const fam = pieza.portada?.familia || 'tipografica';
  const pal = PALETAS[pieza.portada?.paleta || pieza.paleta || 'abismo'];
  const titulo = pieza.portada?.titulo || pieza.titulo;
  if (fam === 'foto') {
    const f = rec[pieza.portada.visual.clave];
    encuadre(g, f, 0, 0, W, H, 1.02);
    const sombra = g.createLinearGradient(0, H * 0.35, 0, H); sombra.addColorStop(0, 'rgba(0,0,0,0)'); sombra.addColorStop(1, 'rgba(0,0,0,0.75)');
    g.fillStyle = sombra; g.fillRect(0, 0, W, H);
    texto(g, titulo, 70, H * 0.6, { ancho: W - 140, tam: W * 0.11, fuente: DISPLAY, peso: 700, sombra: true, max: 4, interlineado: 1.04 });
  } else if (fam === 'movil') {
    fondoPaleta(g, W, H, pal, 0.5);
    const finTitulo = H * 0.1 + texto(g, titulo, 70, H * 0.1, { ancho: W - 140, tam: W * (pieza.portada.tam || 0.09), fuente: DISPLAY, peso: 700, color: pal.tinta, max: 7, interlineado: 1.12 });
    // El móvil ocupa el hueco entre el título y el pie, entero y con el mismo peso en 9:16 y en 4:5
    const arriba = finTitulo + 80, abajo = H - 70;
    const anchoMovil = Math.min(W * 0.5, (abajo - arriba) / 2.14);
    movil(g, rec[pieza.portada.visual.clave], W - 90 - anchoMovil / 2, (arriba + abajo) / 2, anchoMovil, { avance: 0.15, rot: 0.08, ejemplo: pieza.portada.visual.ejemplo });
  } else if (fam === 'cifra') {
    fondoPaleta(g, W, H, pal, 0.3);
    g.save(); g.textAlign = 'center'; g.textBaseline = 'middle'; let tam = W * 0.36; g.font = `700 ${tam}px ${DISPLAY}`;
    while (g.measureText(pieza.portada.cifra).width > W * 0.88) { tam -= 10; g.font = `700 ${tam}px ${DISPLAY}`; }
    g.fillStyle = pal.acento; g.fillText(pieza.portada.cifra, W / 2, H * 0.42); g.restore();
    texto(g, titulo, W / 2, H * 0.62, { ancho: W - 140, tam: W * 0.07, fuente: DISPLAY, peso: 700, color: pal.tinta, alinear: 'center', max: 3 });
  } else if (fam === 'versus') {
    const [a, b] = pieza.portada.visuales.map((v) => rec[v.clave]);
    encuadre(g, a, 0, 0, W / 2, H, 1.05); encuadre(g, b, W / 2, 0, W / 2, H, 1.05);
    g.fillStyle = '#ffffff'; g.fillRect(W / 2 - 4, 0, 8, H * 0.66); // la raya se corta antes del título
    g.save(); g.fillStyle = pal.acento; g.beginPath(); g.arc(W / 2, H * 0.45, W * 0.09, 0, Math.PI * 2); g.fill();
    g.fillStyle = pal.tinta === '#ffffff' ? '#071425' : '#ffffff'; g.font = `700 ${W * 0.07}px ${DISPLAY}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('VS', W / 2, H * 0.45); g.restore();
    const sombra = g.createLinearGradient(0, H * 0.6, 0, H); sombra.addColorStop(0, 'rgba(0,0,0,0)'); sombra.addColorStop(1, 'rgba(0,0,0,0.75)'); g.fillStyle = sombra; g.fillRect(0, 0, W, H);
    texto(g, titulo, W / 2, H * 0.74, { ancho: W - 120, tam: W * 0.085, fuente: DISPLAY, peso: 700, alinear: 'center', sombra: true, max: 3 });
  } else if (fam === 'krill') {
    fondoPaleta(g, W, H, pal, 0.2);
    texto(g, titulo, 70, H * 0.1, { ancho: W - 140, tam: W * 0.1, fuente: DISPLAY, peso: 700, color: pal.tinta, max: 4, interlineado: 1.04 });
    krillEn(g, W * 0.55, H * 0.7, W * 0.75, { expresion: pieza.portada.expresion || 'sorpresa', t: 0.4, parpadeo: 0 });
  } else {
    // Tipográfica a color
    fondoPaleta(g, W, H, pal, 0.1);
    texto(g, titulo, 70, H * 0.18, { ancho: W - 140, tam: W * 0.13, fuente: DISPLAY, peso: 700, color: pal.tinta, max: 5, interlineado: 1.0 });
  }
  logotipo(g, 70, H - 70, W * 0.045, { color: fam === 'foto' || fam === 'versus' ? '#ffffff' : pal.tinta, alpha: 0.9 });
  grano(g, W, H, pieza.n);
}

// ---------- Carrusel v2: cada lámina con su color y, si toca, el móvil con la pantalla real ----------
const CICLO = ['agua', 'arena', 'hondo', 'coral', 'musgo', 'abismo'];
function laminaV2(g, pieza, rec, i, total, W, H) {
  const l = pieza.laminas[i - 1];
  const pal = PALETAS[l.paleta || CICLO[(i + pieza.n) % CICLO.length]];
  fondoPaleta(g, W, H, pal, i * 0.9);
  texto(g, `${i + 1}/${total}`, W - 70, 56, { ancho: 200, tam: 30, alinear: 'right', color: pal.suave, peso: 500 });
  const v = l.v;
  if (!v) {
    // Lámina solo de texto: más grande y con Krill reaccionando abajo (si no, queda media lámina vacía)
    let yy = 190;
    if (l.titulo) yy += texto(g, l.titulo, 70, yy, { ancho: W - 140, tam: 104, fuente: DISPLAY, peso: 700, color: pal.tinta, max: 4, interlineado: 1.04 }) + 34;
    texto(g, l.t, 70, yy, { ancho: W - 160, tam: 48, peso: 500, color: pal.tinta, max: 5, interlineado: 1.3 });
    const gestos = ['normal', 'pensando', 'feliz', 'sorpresa', 'harto'];
    krillEn(g, W - 330, H - 270, 520, { expresion: l.k || gestos[(i + pieza.n) % gestos.length], t: 0.4 + i, parpadeo: 0 });
    logotipo(g, 70, H - 40, 34, { color: pal.tinta, alpha: 0.75 });
    grano(g, W, H, pieza.n + i);
    return;
  }
  let y = 100;
  if (l.titulo) y += texto(g, l.titulo, 70, y, { ancho: W - 140, tam: 78, fuente: DISPLAY, peso: 700, color: pal.tinta, max: 3, interlineado: 1.05 }) + 18;
  y += texto(g, l.t, 70, y, { ancho: W - 140, tam: 40, peso: 500, color: pal.tinta, max: 4, interlineado: 1.3 });
  if (v && v.tipo === 'pagina') {
    const ancho = Math.min(430, (H - y - 70) / 2.06);
    movil(g, rec[v.clave], W / 2, H - 50 - ancho * 1.03, ancho, { avance: 0.08, rot: (i % 2 ? 1 : -1) * 0.04, ejemplo: v.ejemplo });
  } else if (v && v.tipo === 'foto') {
    const f = rec[v.clave], top = y + 50;
    g.save(); rrect(g, 70, top, W - 140, H - top - 110, 36); g.clip(); encuadre(g, f, 70, top, W - 140, H - top - 110, 1.02); g.restore();
    texto(g, 'Foto: ' + f.credito, 70, H - 95, { ancho: W - 140, tam: 20, peso: 400, color: pal.suave, max: 2 });
  } else if (v && v.tipo === 'cifra') {
    g.save(); g.textAlign = 'center'; g.textBaseline = 'middle'; let tam = 260; g.font = `700 ${tam}px ${DISPLAY}`;
    while (g.measureText(v.valor).width > W - 160) { tam -= 10; g.font = `700 ${tam}px ${DISPLAY}`; }
    g.fillStyle = pal.acento; g.fillText(v.valor, W / 2, (y + H) / 2); g.restore();
  }
  logotipo(g, 70, H - 40, 34, { color: pal.tinta, alpha: 0.75 });
  grano(g, W, H, pieza.n + i);
}
function laminaFinal(g, pieza, W, H) {
  const pal = PALETAS[pieza.paletaFinal || 'abismo'];
  fondoPaleta(g, W, H, pal, 2);
  logotipo(g, W / 2, 420, 130, { centrado: true, color: pal.tinta });
  texto(g, pieza.cierre || 'Guárdalo para cuando lo necesites', W / 2, 520, { ancho: W - 160, tam: 54, alinear: 'center', color: pal.tinta, fuente: DISPLAY, peso: 700, max: 3 });
  texto(g, 'Gratis en tankily.com · Enlace en el perfil', W / 2, 650, { ancho: W - 160, tam: 36, alinear: 'center', color: pal.acento, peso: 500 });
  krillEn(g, W / 2 + 30, 1000, 520, { expresion: 'feliz', t: 0.4, parpadeo: 0 });
  grano(g, W, H, pieza.n + 99);
}

async function base64(blob) {
  const buf = new Uint8Array(await blob.arrayBuffer());
  let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode(...buf.subarray(i, i + 0x8000));
  return btoa(s);
}
async function prepararVoz(wavs, textos, segmentos) {
  const ctx = new OfflineAudioContext(1, R.SR, R.SR);
  const res = { pcm: [], dur: [], env: [], texto: textos, seg: segmentos || [] };
  for (const b64 of wavs) {
    const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const d = (await ctx.decodeAudioData(bytes.buffer)).getChannelData(0);
    const paso = Math.round(R.SR / R.FPS), rms = [];
    for (let i = 0; i < d.length; i += paso) { let s = 0; const f = Math.min(d.length, i + paso); for (let j = i; j < f; j++) s += d[j] * d[j]; rms.push(Math.sqrt(s / (f - i))); }
    const max = Math.max(...rms) || 1; const env = []; let prev = 0;
    for (const r of rms) { const v = Math.min(1, Math.max(0, (r / max - 0.12) * 1.6)); prev = prev * 0.35 + v * 0.65; env.push(prev); }
    res.pcm.push(d); res.dur.push(d.length / R.SR); res.env.push(env);
  }
  return res;
}

window.generar = async (pieza, recursosEntrada) => {
  for (const f of [`700 80px ${DISPLAY}`, `600 80px ${DISPLAY}`, `500 80px ${DISPLAY}`, `400 40px ${TEXTO}`, `600 40px ${TEXTO}`, `700 40px ${TEXTO}`]) await document.fonts.load(f);
  const rec = {};
  for (const [k, v] of Object.entries(recursosEntrada)) if (!k.startsWith('__')) rec[k] = typeof v === 'string' ? await cargarImagen(v) : { img: await cargarImagen(v.src), credito: v.credito, sujeto: v.sujeto };

  // Vídeos reales (gancho y escenas de especie): se avanzan fotograma a fotograma (seek) para que el render sea exacto
  rec.__videos = {};
  for (const [clave, v] of Object.entries(recursosEntrada.__videos || {})) {
    const el = document.createElement('video'); el.muted = true; el.preload = 'auto'; el.src = v.src;
    await new Promise((r) => { el.onloadeddata = r; el.onerror = r; });
    rec.__videos[clave] = { el, credito: v.credito };
  }
  const irA = async (t, lin) => {
    const s = lin.tramos.find((x) => t >= x.ini - 0.001 && t <= x.ini + x.d + 0.001);
    if (!s) return;
    const clave = s.tipo === 'gancho' ? pieza.ganchoVideo?.clave : s.e?.v?.video;
    const vid = clave && rec.__videos[clave];
    if (!vid) return;
    // Tiempo continuo a lo largo del reel (cada escena enseña otro momento del clip); si el clip se acaba, vuelve a empezar
    const inicio = s.tipo === 'gancho' ? pieza.ganchoVideo.inicio || 0 : 0, largo = Math.max(1, (vid.el.duration || 1) - 0.2);
    const objetivo = (inicio + t) % largo;
    if (Math.abs(vid.el.currentTime - objetivo) > 0.004) await new Promise((r) => { vid.el.onseeked = r; vid.el.currentTime = objetivo; });
  };
  // Portadas: 1080×1920 (reel) y 1080×1350 (vista en la cuadrícula del perfil)
  const portadas = {};
  for (const [nombre, W, H] of [['portada-reel', 1080, 1920], ['portada-perfil', 1080, 1350]]) {
    const c = new OffscreenCanvas(W, H); portada(c.getContext('2d'), pieza, rec, W, H);
    portadas[nombre] = await base64(await c.convertToBlob({ type: 'image/jpeg', quality: 0.9 }));
  }
  if (pieza.soloPortada) return { portadas };
  if (pieza.formato === 'carrusel') {
    const W = 1080, H = 1350, total = pieza.laminas.length + 2, laminas = [portadas['portada-perfil']];
    for (let i = 1; i < total; i++) {
      const c = new OffscreenCanvas(W, H), g = c.getContext('2d');
      if (i === total - 1) laminaFinal(g, pieza, W, H); else laminaV2(g, pieza, rec, i, total, W, H);
      laminas.push(await base64(await c.convertToBlob({ type: 'image/jpeg', quality: 0.92 })));
    }
    return { portadas, laminas };
  }

  const voz = recursosEntrada.__voz ? await prepararVoz(recursosEntrada.__voz, recursosEntrada.__textos, recursosEntrada.__segmentos) : null;
  const lin = linea(pieza, voz);
  const { W, H, FPS, SR } = R;
  const c = new OffscreenCanvas(W, H); const g = c.getContext('2d');
  const revision = [];
  for (const s of lin.tramos) for (const q of [0.3, 0.75]) { await irA(s.ini + s.d * q, lin); dibujarReel(g, pieza, rec, s.ini + s.d * q, lin, voz); revision.push(await base64(await c.convertToBlob({ type: 'image/jpeg', quality: 0.8 }))); }

  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H, frameRate: FPS },
    ...(voz ? { audio: { codec: 'aac', numberOfChannels: 1, sampleRate: SR } } : {}), fastStart: 'in-memory' });
  let fallo = null;
  if (voz) {
    const pista = new Float32Array(Math.ceil(lin.total * SR));
    lin.tramos.forEach((s) => { const d = voz.pcm[s.iv]; const o = Math.round((s.ini + RETRASO) * SR); if (d && o < pista.length) pista.set(d.subarray(0, pista.length - o), o); });
    // Fondo sonoro de agua y burbujas, muy bajo: da vida y evita silencios totales (algunos altavoces Bluetooth y
    // monitores se apagan en silencio y luego se comen el arranque de la frase siguiente)
    let azar = 12345; const rnd = () => ((azar = (azar * 1103515245 + 12345) % 2147483648) / 2147483648);
    let lp = 0, lp2 = 0;
    for (let i = 0; i < pista.length; i++) {
      const ruido = rnd() * 2 - 1; lp = lp * 0.985 + ruido * 0.015; lp2 = lp2 * 0.9 + lp * 0.1;
      const ola = 0.6 + 0.4 * Math.sin(i / SR * 0.7) * Math.sin(i / SR * 0.23);
      pista[i] += lp2 * 0.55 * ola;
    }
    for (let b = 0.4; b < lin.total; b += 0.35 + rnd() * 1.4) {
      const o = Math.round(b * SR), largo = Math.round(SR * 0.05), f0 = 500 + rnd() * 700;
      for (let j = 0; j < largo && o + j < pista.length; j++) { const tt = j / SR; pista[o + j] += Math.sin(2 * Math.PI * (f0 + 9000 * tt) * tt) * Math.exp(-tt * 70) * 0.03; }
    }
    const aenc = new AudioEncoder({ output: (ch, meta) => muxer.addAudioChunk(ch, meta), error: (e) => { fallo = e; } });
    aenc.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 1, bitrate: 128000 });
    for (let i = 0; i < pista.length; i += 1024) { const n = Math.min(1024, pista.length - i); const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 1, timestamp: Math.round(i * 1e6 / SR), data: pista.slice(i, i + n) }); aenc.encode(ad); ad.close(); }
    await aenc.flush(); if (fallo) throw fallo;
  }
  const enc = new VideoEncoder({ output: (ch, meta) => muxer.addVideoChunk(ch, meta), error: (e) => { fallo = e; } });
  enc.configure({ codec: 'avc1.640028', width: W, height: H, bitrate: 9e6, framerate: FPS });
  const n = Math.ceil(lin.total * FPS);
  for (let i = 0; i < n; i++) {
    await irA(i / FPS, lin);
    dibujarReel(g, pieza, rec, i / FPS, lin, voz);
    const f = new VideoFrame(c, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(f, { keyFrame: i % (FPS * 2) === 0 }); f.close();
    if (enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 4));
    if (fallo) throw fallo;
  }
  await enc.flush(); muxer.finalize();
  return { video: await base64(new Blob([muxer.target.buffer])), portadas, revision, duracion: lin.total };
};
window.listo = true;
</script>
