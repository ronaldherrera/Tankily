<!doctype html>
<html><head><meta charset="utf-8">

<style>

.logo { display: inline-flex; align-items: baseline; font: 500 150px/1 'Fredoka', sans-serif; letter-spacing: -0.01em; white-space: nowrap; }
.logo svg { height: 0.94em; width: 0.675em; margin-right: 0.01em; transform: translateY(0.11em); overflow: visible; }
.lema { font-size: 46px; font-weight: 500; color: #e6f1f7; letter-spacing: -0.005em; }
.sub { font-size: 30px; color: #a9bfce; margin-top: -12px; }

<body>
