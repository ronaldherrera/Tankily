name: Deploy Tankily to Hostinger

on:
  push:
    branches:
      - main  # Asegúrate de que tu rama principal se llame 'main'
  # Cada noche se vuelve a publicar para que los tanques, hilos y anuncios nuevos tengan su página
  # indexable y entren en el sitemap (rsync solo sube lo que ha cambiado)
  schedule:
    - cron: '30 3 * * *'   # 3:30 UTC
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Si algo de esto falla, no se publica nada
      - name: Lint, textos y pruebas
        run: |
          npm run lint
          npm run i18n
          npm test

      - name: Build and Export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_EMAIL_CONTACTO: ${{ vars.NEXT_PUBLIC_EMAIL_CONTACTO }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT }}
          NEXT_PUBLIC_ADSENSE_CMP: ${{ vars.NEXT_PUBLIC_ADSENSE_CMP }}
        run: npm run build

      - name: Enlaces internos rotos
        run: npm run enlaces

      # Sitemap publicado antes de subir el nuevo: IndexNow avisa solo de lo que cambia
      - name: Guardar el sitemap anterior
        run: curl -fsS https://tankily.com/sitemap.xml -o sitemap-anterior.xml || true

      # rsync por SSH en lugar de FTP: una sola conexión, sube solo lo que cambia y borra lo que ya no existe.
      # Con decenas de miles de páginas, el FTP (archivo a archivo) tardaba horas.
      - name: Deploy to Hostinger via rsync (SSH)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DESTINO: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_RUTA }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # --delete-delay: borra lo viejo al final, cuando ya está subido todo lo nuevo.
          # .well-known (certificados) no viene del build y no se toca.
          rsync -rlz --checksum --delete-delay --exclude '.well-known/' \
            -e "ssh -i ~/.ssh/deploy -p ${{ secrets.SSH_PORT }}" \
            ./out/ "$DESTINO"

      - name: Avisar a Bing de las páginas nuevas (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs sitemap-anterior.xml out/sitemap.xml
